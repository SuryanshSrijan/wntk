  'Cora'    : [[[-1, 10], [10, -1], [2]], [[-1, 50], [50, -1], [2]], [[-1, 100], [100, -1], [2]]],
  'PubMed'  : [[[-1, 10], [10, -1], [2]], [[-1, 50], [50, -1], [2]], [[-1, 100], [100, -1], [2]]],
}

train_args: {
