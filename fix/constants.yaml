num_realizations: 1

train_sample_sizes: {
  'Citeseer': [400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000],
  'Cora'    : [400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000],
  'PubMed'  : [400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000],
}

feature_limit: {
  'Citeseer': 1000,
  'Cora'    : -1,
  'PubMed'  : -1,
}

node_limit: {
  'Citeseer': -1,
  'Cora'    : -1,
  'PubMed'  : 10000,
}

GNN_architecture: {
